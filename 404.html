<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Javiera Valverde</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0C0C0F;
      --line: #26262F;
      --ink: #E8E6F0;
      --ink-soft: #9B98B0;
      --accent: #7C6FCD;
      --accent2: #B8AFFE;
      --ff-head: 'Syne', system-ui, sans-serif;
      --ff-body: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ff-body);
      font-weight: 300;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; border-radius: 4px; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }

    header { padding: 1.5rem 0; }
    .brand { font-family: var(--ff-head); font-weight: 700; text-decoration: none; letter-spacing: -0.01em; }

    main { flex: 1; position: relative; display: flex; align-items: center; padding: 2rem 0 4rem; overflow: hidden; }
    .glow {
      position: absolute; width: 560px; height: 560px; right: -160px; top: -80px;
      background: radial-gradient(circle, rgba(124,111,205,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .code {
      position: relative;
      font-family: var(--ff-head);
      font-weight: 800;
      font-size: clamp(5rem, 22vw, 14rem);
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--accent2);
      margin-bottom: 1.5rem;
    }
    h1 {
      position: relative;
      font-family: var(--ff-head);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .lead { position: relative; max-width: 48ch; color: var(--ink-soft); font-size: 1.05rem; margin-bottom: 2.25rem; }
    .actions { position: relative; display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .btn {
      display: inline-block; padding: 0.8rem 1.75rem; border-radius: 6px;
      font-size: 0.9rem; font-weight: 500; text-decoration: none;
      border: 1px solid var(--accent); transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent2); color: #0C0C0F; border-color: var(--accent2); }
    .btn.ghost { color: var(--ink); }
    .btn.ghost:hover { border-color: var(--accent2); color: var(--accent2); }

    @media (prefers-reduced-motion: no-preference) {
      .code { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
    }

    footer { padding: 2rem 0 3rem; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <!-- Ruta absoluta: funciona desde cualquier URL que no exista -->
      <a class="brand" href="/">Javiera Valverde</a>
    </div>
  </header>

  <main>
    <div class="glow" aria-hidden="true"></div>
    <div class="wrap">
      <p class="code" aria-hidden="true">404</p>
      <h1>No encontramos esta página</h1>
      <p class="lead">El enlace puede estar mal escrito o la página ya no existe. Vuelve al inicio o ve directo al proyecto.</p>
      <div class="actions">
        <a class="btn primary" href="/">Volver al inicio</a>
        <a class="btn ghost" href="/#proyecto">Ver mi proyecto</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">© 2026 Javiera Valverde Jara · Santiago, Chile</div>
  </footer>
</body>
</html>
